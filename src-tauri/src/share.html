<!doctype html>
<!-- The page of a shared folder (share.rs). One file with its styles and
     script: the server sends it for /s/<token>/ and everything else it needs
     is under that path (api/folder, thumb/, view/, file/). Text from the
     library is only ever put in with textContent. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Stockroom</title>
<style>
  :root {
    --bg: #f4f4f5; --panel: #ffffff; --fg: #18181b; --dim: #71717a; --line: #e4e4e7;
    --tile: #e4e4e7; --accent: #2563eb; --shade: rgba(9, 9, 11, .94);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --panel: #232327; --fg: #e4e4e7; --dim: #a1a1aa; --line: #2e2e33; --tile: #27272a; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); min-height: 100vh;
    font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line);
  }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 13px; color: var(--dim); }
  .crumbs button { padding: 2px 4px; border-radius: 4px; }
  .crumbs button:hover { background: var(--line); color: var(--fg); }
  .crumbs .sep { opacity: .6; }
  h1 { margin: 2px 0 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--dim); font-size: 12px; }
  main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 1400px; margin: 0 auto; }
  .folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .folder {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0;
  }
  .folder svg { flex: none; color: var(--accent); }
  .folder .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .count { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
  .item { display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; }
  .thumb {
    aspect-ratio: 1; width: 100%; border-radius: 6px; background: var(--tile);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .item .name { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty, .error { color: var(--dim); text-align: center; padding: 48px 16px; }
  .error h2 { color: var(--fg); font-size: 16px; margin: 0 0 6px; }

  /* Viewer */
  .viewer { position: fixed; inset: 0; z-index: 10; background: var(--shade); color: #f4f4f5; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    background: linear-gradient(rgba(0,0,0,.45), transparent);
  }
  .bar .title { flex: 1; min-width: 0; }
  .bar .title div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .sub { font-size: 12px; color: #a1a1aa; }
  .icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; flex: none; text-decoration: none; }
  .icon:hover { background: rgba(255,255,255,.12); }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y pinch-zoom; }
  .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .box img { position: absolute; left: 50%; top: 50%; max-width: none; user-select: none; -webkit-user-drag: none; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #fff; opacity: .7; }
  .nav:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  @media (hover: none) { .nav { display: none; } }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  .card img { max-width: min(80vw, 420px); max-height: 55vh; border-radius: 8px; background: #27272a; }
  .card .dl { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: #fff; color: #18181b; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<header>
  <nav class="crumbs" id="crumbs"></nav>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<main id="main"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="icon" id="close" title="閉じる" aria-label="閉じる">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="title"><div id="vname"></div><div class="sub" id="vsub"></div></div>
    <a class="icon" id="vdl" title="ダウンロード" aria-label="ダウンロード" download>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
    </a>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" title="前へ" aria-label="前へ">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="nav next" id="next" title="次へ" aria-label="次へ">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const FOLDER_ICON =
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';
const KIND = { image: "画像", font: "フォント", file: "ファイル" };

let data = null; // the folder shown (api/folder)
let shown = -1; // index of the item in the viewer, -1 = closed

const size = (n) =>
  n < 1024 ? `${n} B` : n < 1024 ** 2 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1024 ** 2).toFixed(1)} MB`;
const folderOfHash = () => decodeURIComponent(location.hash.slice(1));

async function load() {
  const id = folderOfHash();
  try {
    const res = await fetch("api/folder" + (id ? "?id=" + encodeURIComponent(id) : ""), { cache: "no-store" });
    if (res.status === 404 && id) {
      // A subfolder that was moved away or deleted: back to the shared folder.
      location.hash = "";
      return;
    }
    if (!res.ok) throw new Error(res.status === 404 ? "gone" : String(res.status));
    data = await res.json();
    render();
  } catch (e) {
    failed(e.message === "gone");
  }
}

function failed(gone) {
  data = null;
  $("crumbs").replaceChildren();
  $("title").textContent = "";
  $("meta").textContent = "";
  const box = el("div", "error");
  box.append(el("h2", null, gone ? "この共有は見つかりません" : "読み込めませんでした"));
  box.append(
    el(
      "div",
      null,
      gone
        ? "共有が停止されたか、URL が違います。"
        : "共有したパソコンで Stockroom が開いているか、同じネットワークにつながっているかを確かめてください。",
    ),
  );
  $("main").replaceChildren(box);
}

function render() {
  document.title = `${data.title} – Stockroom`;
  const crumbs = $("crumbs");
  crumbs.replaceChildren();
  data.path.slice(0, -1).forEach((f, i) => {
    const b = el("button", null, f.name);
    b.onclick = () => (location.hash = i === 0 ? "" : encodeURIComponent(f.id));
    crumbs.append(b, el("span", "sep", "›"));
  });
  $("title").textContent = data.path[data.path.length - 1].name;
  const parts = [];
  if (data.folders.length) parts.push(`フォルダ ${data.folders.length}`);
  parts.push(`${data.items.length} 件`);
  $("meta").textContent = parts.join(" · ");

  const main = $("main");
  main.replaceChildren();
  if (data.folders.length) {
    const list = el("div", "folders");
    for (const f of data.folders) {
      const b = el("button", "folder");
      b.innerHTML = FOLDER_ICON;
      b.append(el("span", "name", f.name), el("span", "count", `${f.count}`));
      b.onclick = () => (location.hash = encodeURIComponent(f.id));
      list.append(b);
    }
    main.append(list);
  }
  if (data.items.length) {
    const grid = el("div", "grid");
    data.items.forEach((it, i) => {
      const b = el("button", "item");
      b.title = it.name;
      const t = el("div", "thumb");
      const img = el("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = it.name;
      img.src = it.thumb;
      t.append(img);
      b.append(t, el("span", "name", it.name));
      b.onclick = () => openViewer(i);
      grid.append(b);
    });
    main.append(grid);
  } else if (!data.folders.length) {
    main.append(el("div", "empty", "このフォルダは空です"));
  }
}

// ---------------------------------------------------------------- viewer

function openViewer(i) {
  if (shown < 0) history.pushState({ viewer: true }, "");
  shown = i;
  $("viewer").classList.add("open");
  document.body.style.overflow = "hidden";
  show();
}

function closeViewer() {
  if (shown < 0) return;
  shown = -1;
  $("viewer").classList.remove("open");
  document.body.style.overflow = "";
  for (const c of [...$("stage").children]) if (!c.classList.contains("nav")) c.remove();
}

function show() {
  const it = data.items[shown];
  $("vname").textContent = it.name;
  $("vsub").textContent = `${shown + 1} / ${data.items.length} · ${it.ext.toUpperCase()} · ${size(it.size)}`;
  const dl = $("vdl");
  dl.style.display = data.download ? "" : "none";
  dl.href = data.download ? `file/${encodeURIComponent(it.id)}` : "#";
  $("prev").style.visibility = shown > 0 ? "" : "hidden";
  $("next").style.visibility = shown < data.items.length - 1 ? "" : "hidden";

  const stage = $("stage");
  for (const c of [...stage.children]) if (!c.classList.contains("nav")) c.remove();
  if (it.view && it.width > 0 && it.height > 0) {
    // The box has the displayed (turned) size; the original inside is turned to fill it.
    const box = el("div", "box");
    const img = el("img");
    img.alt = it.name;
    img.src = it.view;
    box.append(img);
    stage.prepend(box);
    fit(box, img, it);
  } else {
    const card = el("div", "card");
    const img = el("img");
    img.alt = it.name;
    img.src = it.thumb;
    card.append(img, el("div", null, `${KIND[it.kind] ?? ""} · ${it.ext.toUpperCase()} · ${size(it.size)}`));
    if (data.download) {
      const a = el("a", "dl", "ダウンロード");
      a.href = `file/${encodeURIComponent(it.id)}`;
      a.download = "";
      card.append(a);
    }
    stage.prepend(card);
  }
  // The neighbours, ready for the next swipe.
  for (const j of [shown - 1, shown + 1]) {
    const n = data.items[j];
    if (n?.view) new Image().src = n.view;
  }
}

function fit(box, img, it) {
  const stage = $("stage");
  const s = Math.min((stage.clientWidth - 16) / it.width, (stage.clientHeight - 16) / it.height, 1);
  const sideways = it.rotation % 2 === 1;
  box.style.width = `${it.width * s}px`;
  box.style.height = `${it.height * s}px`;
  img.style.width = `${(sideways ? it.height : it.width) * s}px`;
  img.style.height = `${(sideways ? it.width : it.height) * s}px`;
  const turn = [];
  if (it.rotation) turn.push(`rotate(${it.rotation * 90}deg)`);
  if (it.flipped) turn.push("scaleX(-1)");
  img.style.transform = `translate(-50%, -50%) ${turn.join(" ")}`;
}

function step(by) {
  const i = shown + by;
  if (shown >= 0 && i >= 0 && i < data.items.length) {
    shown = i;
    show();
  }
}

$("close").onclick = () => history.back();
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
// Back (the phone's back gesture too) closes the viewer.
addEventListener("popstate", () => closeViewer());
addEventListener("keydown", (e) => {
  if (shown < 0) return;
  if (e.key === "Escape") history.back();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});
addEventListener("resize", () => shown >= 0 && show());

// Swipe left / right for the next / previous one.
let touch = null;
$("stage").addEventListener("touchstart", (e) => {
  touch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
$("stage").addEventListener("touchend", (e) => {
  if (!touch || e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touch.x;
  const dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
});

addEventListener("hashchange", load);
// Changes made in the app since: picked up when the page is looked at again.
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && shown < 0 && load());
load();
</script>
</body>
</html>
