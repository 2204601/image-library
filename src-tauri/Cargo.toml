[package]
name = "image-library"
version = "0.12.0"
description = "Local image library manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "image_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
sha2 = "0.11.0"
rayon = "1.12.0"
walkdir = "2.5.0"
hex = "0.4.3"
uuid = { version = "1.27.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.1"
clipboard-rs = "0.3.5"
tauri-plugin-drag = "2.1.1"
resvg = "0.48"
# Fonts: metadata / character map (already used by resvg), WOFF / WOFF2 unpacking.
skrifa = "0.44"
woff2-patched = "0.4"
flate2 = "1"
tempfile = "3.27.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Local HTTP server for the browser extension (webimport.rs).
tiny_http = "0.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO with the default 16 codegen units instead of fat LTO + 1 unit:
# measured on an M-series Mac, a rebuild with cached dependencies drops from
# 93 s to 36 s (from scratch 159 s -> 102 s). The binary grows 9.8 -> 12.2 MB,
# about +0.5 MB once compressed in the installer.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_Networking_WinHttp"] }

# System proxy lookup (PAC) for the updater, see proxy.rs.
[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"
