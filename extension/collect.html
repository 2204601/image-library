<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ページの画像 - Image Library</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px 16px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header .page {
        flex: 1 1 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .page img {
        width: 22px;
        height: 22px;
      }
      header .page div {
        min-width: 0;
      }
      header .page strong,
      header .page small {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      header .page small {
        color: var(--dim);
      }
      header .field {
        margin: 0;
      }
      .size input {
        width: 76px;
      }
      .size .pair {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .formats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .formats label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        font-size: 12px;
        cursor: pointer;
      }
      .dest {
        display: flex;
        gap: 8px;
        flex: 1 1 420px;
      }
      .dest .field:first-child {
        flex: 0 0 200px;
      }
      .dest .field:last-child {
        flex: 1;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
      }
      .bar .count {
        flex: 1;
        color: var(--dim);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 8px;
        background: var(--panel);
        text-align: left;
        overflow: hidden;
      }
      .tile.selected {
        border-color: var(--accent);
      }
      .tile .pic {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        background: repeating-conic-gradient(var(--raised) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px;
      }
      .tile .pic img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .tile .meta {
        padding: 4px 8px 6px;
        font-size: 11px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .check {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 20px;
        height: 20px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
      }
      .tile.selected .check {
        background: var(--accent);
      }
      .tile.selected .check::after {
        content: "✓";
        display: block;
        color: #fff;
        font-size: 12px;
        line-height: 16px;
        text-align: center;
      }
      .tile .state {
        position: absolute;
        top: 6px;
        right: 6px;
        padding: 0 6px;
        border-radius: 10px;
        font-size: 11px;
        color: #fff;
      }
      .tile .state.ok {
        background: var(--ok);
      }
      .tile .state.error {
        background: var(--danger);
      }
      .tile .state.busy {
        background: rgba(0, 0, 0, 0.6);
      }
      .empty {
        padding: 48px 0;
        text-align: center;
        color: var(--dim);
      }
      #status:empty {
        display: none;
      }
      #status {
        margin: 0 16px;
        padding-top: 8px;
      }
      @media (max-width: 560px) {
        #grid {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        }
        .dest {
          flex-direction: column;
        }
        .dest .field:first-child {
          flex: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="page">
        <img src="icons/32.png" alt="" />
        <div>
          <strong id="page-title">ページの画像</strong>
          <small id="page-url"></small>
        </div>
      </div>
      <div class="field size">
        <span>最小の大きさ（幅・高さ px）</span>
        <div class="pair">
          <input id="min-w" type="number" min="0" step="50" value="100" aria-label="最小の幅" />
          ×
          <input id="min-h" type="number" min="0" step="50" value="100" aria-label="最小の高さ" />
        </div>
      </div>
      <div class="field">
        <span>形式</span>
        <div id="formats" class="formats"></div>
      </div>
      <div class="dest" id="dest" hidden>
        <label class="field">
          <span>保存先のフォルダ</span>
          <select id="folder"></select>
        </label>
        <div class="field">
          <span>付けるタグ</span>
          <div id="tags" class="tags">
            <input id="tag-input" type="text" list="tag-list" placeholder="タグを入力して Enter" />
          </div>
          <datalist id="tag-list"></datalist>
        </div>
      </div>
    </header>
    <div id="status" class="status"></div>
    <div class="bar">
      <span class="count" id="count"></span>
      <button id="select-all" class="btn">すべて選択</button>
      <button id="select-none" class="btn">選択を解除</button>
      <button id="save" class="btn primary" disabled>保存</button>
    </div>
    <main>
      <div id="grid"></div>
      <p id="empty" class="empty" hidden></p>
    </main>
    <script type="module" src="collect.js"></script>
  </body>
</html>
